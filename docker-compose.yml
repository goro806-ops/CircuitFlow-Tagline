version: '3.8'

services:
  circuitflow-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: circuitflow-eda-platform
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
