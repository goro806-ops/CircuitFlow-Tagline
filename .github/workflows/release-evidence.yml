name: Release Evidence Lint

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/validate-release-evidence.js'
      - '.github/workflows/release-evidence.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/validate-release-evidence.js'
      - '.github/workflows/release-evidence.yml'

permissions:
  contents: read

jobs:
  evidence-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Validate release evidence package
        run: node scripts/validate-release-evidence.js

      - name: Check Markdown and workflow whitespace
        run: git diff --check
