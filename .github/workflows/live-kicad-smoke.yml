name: Live KiCad Smoke Test

on:
  workflow_dispatch:
    inputs:
      live_base_url:
        description: 'Deployed CircuitFlow base URL'
        required: true
        default: 'https://circuitflow-docker.onrender.com'
        type: string
      project_id:
        description: 'Disposable or explicitly approved read-only project ID'
        required: true
        default: 'proj_mvwjheaaj7jg02'
        type: string

permissions:
  contents: read

jobs:
  live-kicad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run live read-only KiCad smoke test
        env:
          LIVE_BASE_URL: ${{ inputs.live_base_url }}
          LIVE_PROJECT_ID: ${{ inputs.project_id }}
        run: node scripts/live-kicad-smoke.js | tee live-kicad-report.json
      - name: Upload sanitized report
        uses: actions/upload-artifact@v4
        with:
          name: live-kicad-smoke-${{ github.run_id }}
          path: live-kicad-report.json
          retention-days: 14
          if-no-files-found: error
