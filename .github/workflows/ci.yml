name: CircuitFlow CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run application and health tests
        run: npm test

      - name: Run multi-agent smoke test without external credentials
        env:
          OPENAI_API_KEY: ''
          GROQ_API_KEY: ''
          XAI_API_KEY: ''
          ANTHROPIC_API_KEY: ''
          LLM_PROVIDER: ''
        run: npm run test:agents

      - name: Check production dependency audit
        run: npm audit --omit=dev --audit-level=high
